# The workspace of the tool-particle repository. Every crate under crates/ is a
# member; add a crate by adding its directory.
[workspace]
# The resolver of edition 2024, the monorepo's, so a crate resolves the same
# features and the same MSRV-aware versions on both sides of an extraction.
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
repository = "https://github.com/TheClockwyrks/tool-particle"
# A crate of The Test Cabinet is consumed by its git source, never from
# crates.io, so none is published; a member says `publish.workspace = true`, and
# Cargo refuses that key when the root holds none to inherit.
publish = false

# Warnings-as-errors, baked into the manifests for every member crate that
# opts in with `[lints] workspace = true`, so a plain `cargo build` enforces
# the policy the clippy gate enforces on the command line.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

# The crates of the other repositories this one may depend on, each at its
# public source, the GitHub mirror, and the tag its dependents pin. The
# superrepo's .cargo/config.toml redirects every one of these to the sibling
# checkout, so a build inside the superrepo never fetches them. A manifest
# never names an Azure URL or a path outside the repository: the
# dependency-edges gate refuses both.
[workspace.dependencies]
test-cabinet-contracts = { git = "https://github.com/TheClockwyrks/contracts", tag = "v0.2.2" }
# The model core the particle crates build on: the F-curve model behind the
# size and opacity curves, and the shared mesh preview renderer particle-3d
# billboards through. Taken without its default features, so the particle
# library alone never compiles the renderer stack; particle-core's `cli`
# feature turns its `cli` feature on.
test-cabinet-model-core = { git = "https://github.com/TheClockwyrks/tool-model-core", tag = "v0.1.0", default-features = false }

# The third-party crates the members share, at the requirements the monorepo
# held them to when the crates were extracted from it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# PNG encoding for the preview frames, and decoding of the 3D renderer's
# preview PNGs. A small, pure-Rust codec with no system dependency.
png = "0.17"
# GIF encoding for the particle binaries' animated preview (the packed
# effect.gif the reviewer plays): a pure-Rust encoder (LZW via `weezl`, palette
# quantization via `color_quant`), no system dependency, matching the `png`
# stance. Only particle-core's `cli` feature pulls it in.
gif = "0.14"
